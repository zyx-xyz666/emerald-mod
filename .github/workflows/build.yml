name: Build Mod
permissions:
  contents: write
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Download Forge MDK
      run: |
        wget https://maven.minecraftforge.net/net/minecraftforge/forge/1.20.1-47.2.0/forge-1.20.1-47.2.0-mdk.zip
        unzip -q forge-1.20.1-47.2.0-mdk.zip -d .
    - name: Setup Configuration and Code
      run: |
        # 核心：直接覆盖它的 gradle.properties，让它从源头改名！
        cat <<EOF > gradle.properties
        org.gradle.jvmargs=-Xmx3G
        org.gradle.daemon=false
        org.gradle.parallel=true
        org.gradle.caching=true
        mod_id=emeraldartistry
        mod_name=Emerald Artistry
        mod_license=MIT
        mod_version=1.0.3
        mod_group_id=com.example.emeraldartistry
        mod_authors=You
        mod_description=Emerald Craft
        EOF
        
        # 放置你的 Java 代码
        mkdir -p src/main/java/com/example/emeraldartistry
        cp EmeraldArtistryMod.java src/main/java/com/example/emeraldartistry/
        
        # 生成资源文件
        mkdir -p src/main/resources/assets/emeraldartistry/lang
        cat <<EOF > src/main/resources/assets/emeraldartistry/lang/zh_cn.json
        {
          "item.emeraldartistry.emerald_greatsword": "翠玉巨剑",
          "item.emeraldartistry.emerald_greatsword.tooltip.active": "§a右键：翠玉横斩",
          "item.emeraldartistry.emerald_greatsword.tooltip.passive": "§2被动：生命共鸣"
        }
        EOF
        mkdir -p src/main/resources/assets/emeraldartistry/models/item
        cat <<EOF > src/main/resources/assets/emeraldartistry/models/item/emerald_greatsword.json
        {
          "parent": "minecraft:item/handheld",
          "textures": { "layer0": "emeraldartistry:item/emerald_greatsword" }
        }
        EOF
        mkdir -p src/main/resources/data/emeraldartistry/recipes
        cat <<EOF > src/main/resources/data/emeraldartistry/recipes/emerald_greatsword.json
        {
          "type": "minecraft:crafting_shaped",
          "pattern": [" E ", " E ", " S "],
          "key": {
            "E": { "item": "minecraft:emerald_block" },
            "S": { "item": "minecraft:stick" }
          },
          "result": { "item": "emeraldartistry:emerald_greatsword", "count": 1 }
        }
        EOF
        mkdir -p src/main/resources/assets/emeraldartistry/textures/item
        wget -q -O src/main/resources/assets/emeraldartistry/textures/item/emerald_greatsword.png https://raw.githubusercontent.com/misode/mcmeta/assets/assets/minecraft/textures/item/emerald.png
    - name: Build with Gradle
      run: |
        chmod +x gradlew
        ./gradlew build
    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: build/libs/*.jar
        tag_name: v1.0.3
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
